[project]
name = "simple-markdown-llm-benchmark"
version = "0.1.0"
description = "Generate markdown tables and exact-answer retrieval questions for benchmarking LLMs"
readme = "README.md"
authors = [
    { name = "John Hopfensperger", email = "user@example.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
simple-markdown-llm-benchmark = "simple_markdown_llm_benchmark.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pyrefly]
preset = "strict"
type-ignore-unknown-tag-behavior = "no-effect"

[tool.ruff]
line-length = 120
